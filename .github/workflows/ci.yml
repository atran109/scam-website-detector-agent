# Runs on every push to main and every pull request.
# Neither job contacts a real target site: `check` is lint plus unit tests, and `browser` runs
# Chromium against local fixtures in a container with no network (docker-compose `browser-tests`).
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: make check PYTHON=python

  browser:
    name: Browser suite (offline container)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: make test-browser
