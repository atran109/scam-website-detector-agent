[project]
name = "scamhunter"
version = "0.1.0"
description = "Crypto scam detection agent (TRM Labs take-home)"
readme = "README.md"
requires-python = ">=3.12,<3.13"
# Pinned exactly for reproducibility. Add each dependency in the milestone that first uses it.
dependencies = [
    "pydantic==2.13.5",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "ruff==0.16.10",
]

[project.scripts]
scamhunter = "scamhunter.cli:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
