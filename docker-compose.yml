# Crawler + egress proxy (DESIGN §5.6). The crawler has no route out except the proxy.
name: scamhunter

services:
  egress-proxy:
    build: docker/egress-proxy
    networks: [internal, egress]
    extra_hosts:                                  # DNS-independent rebinding probe (selftest):
      - "rebind-linklocal.selftest.test:169.254.169.254"   # names that resolve, in the proxy's
      - "rebind-private.selftest.test:192.168.0.1"         # /etc/hosts, to addresses it must
      - "rebind-loopback.selftest.test:127.0.0.1"          # never connect to
    volumes:
      - ./runs/${RUN_ID:-adhoc}:/var/log/squid    # egress.log lands in the run directory
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 256m
    pids_limit: 128
    cpus: 1

  crawler:
    build: {context: ., target: base}
    networks: [internal]                          # internal only: no direct internet route
    depends_on:
      egress-proxy: {condition: service_started}
      llm-gateway: {condition: service_healthy}
    environment:
      RUN_ID: ${RUN_ID:-adhoc}
      EGRESS_PROXY: http://egress-proxy:3128
      SELFTEST_ROUTER_IP: ${SELFTEST_ROUTER_IP:-}
    volumes:                                      # the only host mounts
      - ./runs:/app/runs
      - ./output:/app/output
    cap_drop: [ALL]
    security_opt:
      - "no-new-privileges:true"
      - "seccomp=docker/seccomp/chromium.json"    # Docker default + userns syscalls for Chromium's sandbox
    mem_limit: 4g
    pids_limit: 1024
    cpus: 4
    shm_size: 1g                                  # Chromium uses /dev/shm heavily
    init: true                                    # reap orphaned browser processes

  llm-gateway:                                    # the only container with the API key
    build: {context: ., target: gateway}
    networks: [internal]                          # no direct internet: API via proxy port 3129
    depends_on: [egress-proxy]
    env_file: [.env]
    environment:
      ANTHROPIC_PROXY: http://egress-proxy:3129
      LLM_CACHE_DIR: /app/llm
    volumes:
      - ./runs/llm_cache:/app/llm                 # response cache + token usage log
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"]
      interval: 2s
      timeout: 3s
      retries: 15
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 512m
    pids_limit: 128
    cpus: 1

  browser-tests:                                  # offline Chromium tests: no network at all
    profiles: [test]
    build: {context: ., target: test}
    network_mode: none
    cap_drop: [ALL]
    security_opt:
      - "no-new-privileges:true"
      - "seccomp=docker/seccomp/chromium.json"
    mem_limit: 2g
    pids_limit: 512
    shm_size: 1g
    init: true

networks:
  internal:
    internal: true
  egress: {}
